[project]
name = "plt-lens-classifier"
version = "2.0.0"
description = "TLens tray slot inspection with OpenCV alignment and MobileNet/DINOv2 classifiers"
readme = "README.md"
requires-python = ">=3.10"
# Inspection runtime only (what the desktop sidecar bundles); training and DINOv2 need the "train" group.
dependencies = [
    "opencv-python>=4.10",
    "numpy>=1.26",
    "onnxruntime>=1.20",
]

[dependency-groups]
train = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45,<5.0",
    "accelerate>=0.34",
    "albumentations>=1.4",
    "Pillow>=10.4",
    "PyYAML>=6.0",
    "onnx>=1.17",
    "onnxscript>=0.2",
]
dev = ["pytest>=8.3"]
build = ["pyinstaller>=6.11"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
# Scripts run from the repo root (`python -m src...`); nothing to build or install.
package = false
default-groups = ["train", "dev"]
